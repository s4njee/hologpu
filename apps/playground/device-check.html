<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HoloGPU · Device check</title>
    <style>
      body {
        font: 15px Arial;
        background: #17120f;
        color: #eee0d2;
        margin: 28px auto;
        padding: 0 20px;
        max-width: 1100px;
      }
      a {
        color: #d99a63;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        padding: 12px 18px;
        margin: 8px 8px 8px 0;
      }
      input {
        max-width: 100%;
      }
      #surfaces {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
      }
      .sample {
        height: 180px;
        border: 1px solid #866c56;
        position: relative;
        overflow: hidden;
        border-radius: 12px;
      }
      .sample h2 {
        margin: 40px 16px;
        font-size: 32px;
      }
      .sample img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .sample[data-hgpu-state='ready'] img {
        opacity: 0;
      }
      .sample svg {
        width: 100%;
        height: 100%;
      }
      .sample[data-hgpu-state='ready'] svg {
        visibility: hidden;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 260px;
        background: #211913;
        color: #eee0d2;
      }
      label {
        display: block;
        margin: 20px 0 8px;
      }
      #progress {
        width: 280px;
        accent-color: #d99a63;
      }
    </style>
  </head>
  <body>
    <h1>Device check</h1>
    <p>
      Run this page in the browser being tested. It checks the launch effects, settled motion,
      canvas output, cleanup, and first-frame completion. The report stays in this browser until you
      download it.
    </p>
    <p>
      <a href="/launch.html">View the launch page ↗</a> ·
      <a href="?fallback=1">Force native fallbacks</a>
    </p>
    <label for="device">Device and browser version</label
    ><input id="device" placeholder="e.g. iPhone 16, iOS 26, Safari 26" size="48" />
    <div>
      <button id="run">Run checks</button><button id="save" disabled>Download report</button
      ><button id="native">Test native button</button><output id="clicks">0</output>
    </div>
    <label for="progress">Test native slider</label
    ><input id="progress" type="range" min="0" max="100" value="50" /><output id="value">50</output>
    <p id="status" role="status">Ready to run.</p>
    <div id="surfaces"></div>
    <label for="report">Report</label><textarea id="report" readonly></textarea>
    <script type="module" src="/src/device-check.ts"></script>
  </body>
</html>
